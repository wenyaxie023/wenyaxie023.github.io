- title: Academic Interests
  type: nested_list
  contents:
    - title: AI That Understands People
      items:
        - How AI can infer what a person wants from vague requests, everyday activity, and feedback, both to act for the person (personal agents) and to act as the person (user simulation).

    - title: Training
      items:
        - Mid-training on synthetic data to predict how individuals decide, and post-training from vague, real-world user feedback.

    - title: Memory and Test-Time Adaptation
      items:
        - How agents store, update, and retrieve what they know about a user, and how models decide when to ask, reason, or act.

    - title: Broad Interests
      items:
        - Personal agents, user simulation, mid-/post-training, test-time adaptation, memory, and scaling laws.

